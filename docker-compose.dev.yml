services:
  nginx:
    build: ./nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/arcsi.conf:/etc/nginx/conf.d/arcsi.conf
    depends_on:
      - web
    env_file:
      - srv.env
    entrypoint: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
  
  web:
    links:
      - "db"
    build: .
    hostname: ${HOSTNAME}
    image: arcsi:0.4.9
    restart: always
    expose:
      - 5666
    volumes:
      - .:/app
    depends_on:
      - db
    env_file: 
      - app.env
      - db.env
    command:
    environment:
      - GUNICORN_CMD_ARGS=--reload --log-level debug
    entrypoint: sh -c 'sleep 15; /app/entrypoint.sh'

  db:
    image: postgres:12
    restart: always
    volumes:
      - ./test/empty_dump.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    expose:
      - 5432
    env_file:
      - db.env
